# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.database=thindesk
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
spring.security.user.name=${THINDESK_USER:usuario}
spring.security.user.password=${THINDESK_PASSWORD:usuario123}
spring.security.user.roles=USER
thindesk.admin.username=${THINDESK_ADMIN_USER:admin}
thindesk.admin.password=${THINDESK_ADMIN_PASSWORD:admin123}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.pfc=INFO
