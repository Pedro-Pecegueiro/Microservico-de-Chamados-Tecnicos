<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ThinDesk | Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="page-content">
    <header class="page-heading">
        <div>
            <p class="dashboard-eyebrow mb-1">THINDESK / ATENDIMENTO</p>
            <h1 class="h2 mb-1">Chamados</h1>
            <p class="text-secondary mb-0">Abertura, acompanhamento e resolução de chamados técnicos.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/chamados/novo}"><i class="bi bi-plus-lg me-1"></i> Novo chamado</a>
    </header>

    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

    <section class="card dashboard-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Chamado</th><th>Solicitante</th><th>Abertura</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(chamados)}">
                    <td colspan="5" class="text-center text-secondary py-5">Nenhum chamado cadastrado.</td>
                </tr>
                <tr th:each="chamado : ${chamados}">
                    <td>
                        <div class="fw-semibold" th:text="${chamado.titulo != null ? chamado.titulo : 'Chamado sem título'}"></div>
                        <div class="small text-secondary" th:text="${chamado.descricao}"></div>
                    </td>
                    <td th:text="${chamado.solicitante != null ? chamado.solicitante : '—'}"></td>
                    <td class="small" th:text="${chamado.dataAbertura != null ? chamado.dataAbertura : '—'}"></td>
                    <td>
                        <span th:if="${'ABERTO'.equalsIgnoreCase(chamado.status)}" class="badge rounded-pill text-bg-warning">ABERTO</span>
                        <span th:if="${'RESOLVIDO'.equalsIgnoreCase(chamado.status)}" class="badge rounded-pill text-bg-success">RESOLVIDO</span>
                        <span th:if="${chamado.status == null or (!'ABERTO'.equalsIgnoreCase(chamado.status) and !'RESOLVIDO'.equalsIgnoreCase(chamado.status))}" class="badge rounded-pill text-bg-secondary" th:text="${chamado.status != null ? chamado.status : 'SEM STATUS'}"></span>
                    </td>
                    <td class="actions-cell">
                        <div th:if="${'ABERTO'.equalsIgnoreCase(chamado.status)}" class="d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/chamados/editar/{id}(id=${chamado.id})}">Editar</a>
                            <form th:if="${admin}" th:action="@{/chamados/resolver/{id}(id=${chamado.id})}" method="post" class="d-flex gap-1">
                                <input class="form-control form-control-sm solution-input" name="solucao" type="text" maxlength="1000" placeholder="Solução aplicada" required>
                                <button class="btn btn-success btn-sm" type="submit">Resolver</button>
                            </form>
                            <form th:action="@{/chamados/cancelar/{id}(id=${chamado.id})}" method="post" onsubmit="return confirm('Cancelar este chamado aberto?')">
                                <button class="btn btn-outline-danger btn-sm" type="submit">Cancelar</button>
                            </form>
                        </div>
                        <span th:if="${'RESOLVIDO'.equalsIgnoreCase(chamado.status)}" class="small text-secondary">Edição bloqueada após resolução</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
