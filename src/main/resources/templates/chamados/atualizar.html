<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ThinDesk | Editar chamado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="page-content">
    <header class="page-heading"><div><p class="dashboard-eyebrow mb-1">THINDESK / ATENDIMENTO</p><h1 class="h2 mb-1">Editar chamado</h1><p class="text-secondary mb-0">Somente chamados abertos podem ser alterados.</p></div></header>
    <form class="card form-card" th:action="@{/chamados/atualizar/{id}(id=${chamadoId})}" th:object="${form}" method="post">
        <div class="mb-3"><label class="form-label" for="titulo">Título</label><input class="form-control" id="titulo" th:field="*{titulo}" maxlength="120" required><div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div></div>
        <div class="mb-3"><label class="form-label" for="descricao">Descrição</label><textarea class="form-control" id="descricao" th:field="*{descricao}" rows="5" maxlength="5000" required></textarea><div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div></div>
        <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Salvar alterações</button><a class="btn btn-outline-secondary" th:href="@{/chamados}">Cancelar</a></div>
    </form>
</main>
</body>
</html>
